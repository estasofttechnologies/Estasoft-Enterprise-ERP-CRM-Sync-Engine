name: Set up PHP and Composer
description: Installs PHP with the extensions the checks need, restores the Composer download cache and runs composer install.

inputs:
  php-version:
    description: PHP version to install, for example 8.3.
    required: true
  install:
    description: Run composer install after PHP is ready ("true" or "false").
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, sodium, intl, curl, mysqli, zip
        coverage: none
        tools: composer:v2

    - name: Find the Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Restore the Composer cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.json', 'composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-php${{ inputs.php-version }}-

    - name: Install Composer dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist
